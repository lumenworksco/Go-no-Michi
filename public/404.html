<!doctype html>
<html lang="ja">
  <head>

    <meta name="color-scheme" content="dark" />
    <title>みつかりません・ごのみち</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0c0e; color: #efece6;

      main { padding: 24px; }
      h1 { font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif; font-size: 26px; letter-spacing: 0.08em; margin: 0 0 10px; }
      p { color: #8d9098; line-height: 1.8; margin: 0 0 22px; }
      a { display: inline-block; padding: 14px 28px; border-radius: 16px; background: #e3c07f; color: #231705; text-decoration: none; font-size: 16px; }

  <body>
    <main>
      <h1>ページが みつかりません</h1>
      <p>この アドレスには なにも ありません。<br />ホームから もういちど はじめて ください。</p>
