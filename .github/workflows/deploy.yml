name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# 使っているアクションは、タグではなくコミットの SHA で固定している（コメントはそのバージョン）。
# 更新は Dependabot（.github/dependabot.yml）が提案する。
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # カスタムドメイン（go.braunf.com）のルートで公開するので base は '/'。
      # github.io/<リポジトリ名>/ で公開する場合は BASE_PATH: /<リポジトリ名>/ を指定する。
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  # ビルドしたものを、実際のブラウザ（Chromium と WebKit・スマホ幅とデスクトップ幅）で動かして確かめる。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  deploy:
    # 公開は main ブランチのときだけ（PR や、ほかのブランチからの手動実行では公開しない）。
    # 単体テストと e2e の両方が通ったときに限る。
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
